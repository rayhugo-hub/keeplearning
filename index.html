<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<link rel="manifest" href="manifest.webmanifest">
<title>保持学习</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--accent:#4f6ef7;--accent-soft:#f0f4ff;--bg:#f6f7f9;--card:#fff;--text:#1a1a2e;--muted:#8a8fa3}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
  }
  /* 顶栏 */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:linear-gradient(135deg,#4f6ef7,#6a5cf0);
    color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;
    box-shadow:0 2px 12px rgba(79,110,247,.28);
  }
  .topbar h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:.4rem}
  .topbar .sub{font-size:.8rem;opacity:.85;margin-top:2px}
  .progress{margin-top:12px}
  .progress-row{display:flex;justify-content:space-between;font-size:.78rem;opacity:.95;margin-bottom:5px}
  .progress-row b{font-weight:700}
  .bar{height:7px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:#fff;border-radius:99px;width:0;transition:width .4s ease}
  /* 搜索 */
  .search{position:sticky;top:0;margin:14px 14px 0;z-index:9}
  .search input{
    width:100%;padding:11px 14px 11px 40px;font-size:.92rem;border:none;border-radius:12px;
    background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.06);outline:none;color:var(--text);
  }
  .search input:focus{box-shadow:0 0 0 2px var(--accent)}
  .search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none}
  .search{position:relative}
  /* 列表 */
  .list{padding:14px 14px 0;max-width:640px;margin:0 auto}
  .card{
    display:block;background:var(--card);border-radius:14px;padding:14px 15px;margin-bottom:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);text-decoration:none;color:var(--text);
    transition:transform .1s ease,box-shadow .1s ease;
  }
  .card:active{transform:scale(.985);box-shadow:0 1px 5px rgba(0,0,0,.08)}
  .card-top{display:flex;align-items:flex-start;gap:11px}
  .num{
    flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.95rem;
  }
  .num.done{background:#e8f5e9;color:#2e7d32}
  .card-body{flex:1;min-width:0}
  .card-title{font-size:.95rem;font-weight:600;line-height:1.5;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta{font-size:.75rem;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;padding:1px 7px;border-radius:99px;font-weight:600}
  .badge-done{color:#2e7d32;background:#e8f5e9}
  .badge-new{color:#e65100;background:#fff3e0}
  .ans-link{color:var(--accent);font-weight:600;text-decoration:none;font-size:.78rem}
  .ans-link:active{opacity:.6}
  .empty{text-align:center;color:var(--muted);padding:48px 0;font-size:.9rem}
  .footer{text-align:center;color:var(--muted);font-size:.72rem;padding:20px 14px}
</style>
</head>
<body>
  <header class="topbar">
    <h1>📚 保持学习</h1>
    <div class="sub">汽车电子课程 · 手机端</div>
    <div class="progress">
      <div class="progress-row"><span>学习进度</span><b><span id="done">0</span>/<span id="total">0</span> 已完成</b></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <div class="search"><input id="q" type="search" placeholder="搜索主题，如：以太网 / TSN / AUTOSAR / 网关…" autocomplete="off"></div>

  <main class="list" id="list"></main>

  <div class="footer">数据保存在本机 · 支持离线学习</div>

<script src="lessons.js"></script>
<script>
(function(){
  var LESSONS = (window.TEACHME_LESSONS || []).slice().sort(function(a,b){return b.n-a.n;});
  var KEY_PREFIX = 'teachme_complete_lesson';

  function isDone(n){
    try { return localStorage.getItem(KEY_PREFIX + String(n).padStart(2,'0')) !== null; }
    catch(e){ return false; }
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function render(filter){
    var q = (filter||'').trim().toLowerCase();
    var list = document.getElementById('list');
    var shown = LESSONS.filter(function(L){
      if(!q) return true;
      return (L.title + ' ' + L.topic).toLowerCase().indexOf(q) !== -1;
    });
    if(!shown.length){
      list.innerHTML = '<div class="empty">没有匹配「' + esc(filter) + '」的课程</div>';
      return;
    }
    var maxN = LESSONS[0] ? LESSONS[0].n : 0;
    list.innerHTML = shown.map(function(L){
      var done = isDone(L.n);
      var isNew = L.n === maxN;
      var badges = done
        ? '<span class="badge badge-done">✅ 已学</span>'
        : (isNew ? '<span class="badge badge-new">✨ 新课</span>' : '');
      return '<a class="card" href="' + esc(L.dir) + '/课程.html">' +
        '<div class="card-top">' +
          '<span class="num' + (done?' done':'') + '">' + L.n + '</span>' +
          '<div class="card-body">' +
            '<div class="card-title">' + esc(L.title) + '</div>' +
            '<div class="card-meta">' +
              '<span>📅 ' + esc(L.date) + (L.time ? ' ' + esc(L.time) : '') + '</span>' + badges +
              '<a class="ans-link" href="' + esc(L.dir) + '/答案.html">📖 答案</a>' +
            '</div>' +
          '</div>' +
        '</div></a>';
    }).join('');
  }

  function updateProgress(){
    var total = LESSONS.length;
    var done = LESSONS.filter(function(L){return isDone(L.n);}).length;
    document.getElementById('total').textContent = total;
    document.getElementById('done').textContent = done;
    document.getElementById('bar').style.width = (total ? Math.round(done/total*100) : 0) + '%';
  }

  // 监听其它页面返回后 localStorage 变化（标记已学 / 取消）
  window.addEventListener('storage', function(e){
    if(e.key && e.key.indexOf(KEY_PREFIX) === 0){ updateProgress(); render(document.getElementById('q').value); }
  });
  // 从课程页返回本页时刷新（pageshow 对 bfcache 也生效）
  window.addEventListener('pageshow', function(){
    updateProgress(); render(document.getElementById('q').value);
  });

  document.getElementById('q').addEventListener('input', function(){
    render(this.value);
  });

  render('');
  updateProgress();
})();
</script>
<script>
  // 注册离线缓存 Service Worker（首次联网打开后，全部课程可离线学习）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
